updateNotifier: false
update:
  githubActions: false
allowBuilds:
  # This doesn't affect the build.
  # https://github.com/evanw/esbuild/blob/cd832972927f1f67b6d2cc895c06a8759c1cf309/npm/esbuild/package.json#L20-L47
  esbuild: false
saveTypes: true
autoDedupe: true
dedupePeers: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080 # 1 week
minimumReleaseAge: 1440 # 1 day
